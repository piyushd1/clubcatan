name: Deploy

# Runs only on pushes to main. Repeats the CI checks, then deploys the Worker
# (server + static client) to Cloudflare with wrangler. Every merge to main is
# a production deploy to https://catan.piyushdev.com.
on:
  push:
    branches: [main]

# Serialise deploys so two quick merges can't race each other. The newer run
# waits for the older one; nothing is cancelled mid-deploy.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install client deps
        run: npm ci --prefix client

      - name: Build client bundle
        run: npm run build

      - name: Run tests (client + game logic)
        run: npm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          # Repo secrets (Settings → Secrets and variables → Actions):
          #   CLOUDFLARE_API_TOKEN  — "Edit Cloudflare Workers" template plus
          #                           Zone → DNS → Edit on piyushdev.com (the
          #                           custom-domain record is created on first deploy).
          #   CLOUDFLARE_ACCOUNT_ID — from the Workers & Pages overview page.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
