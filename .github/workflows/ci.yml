name: CI

# Runs on every push and every pull request. Builds the client, runs both test
# suites, and dry-runs the Worker bundle so a broken wrangler.jsonc fails here
# instead of in the deploy job.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root deps (partyserver, wrangler)
        run: npm ci

      - name: Install client deps
        run: npm ci --prefix client

      - name: Build client bundle
        run: npm run build

      - name: Run tests (client + game logic)
        run: npm test

      - name: Validate Worker config and bundle (dry run)
        run: npm run check:wrangler
